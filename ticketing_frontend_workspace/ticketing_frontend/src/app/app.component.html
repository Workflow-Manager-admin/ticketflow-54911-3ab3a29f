<!-- Top Navigation Bar -->
<nav class="navbar shadow" style="height: var(--navbar-height); background: var(--primary); color: #fff; padding: 0 1.5rem; position: fixed; top: 0; left: 0; right: 0; z-index: 1110; display: flex; align-items: center;">
  <button class="btn" style="background: transparent; color: #fff; font-size: 1.6em; box-shadow: none; padding: 0 0.7em; border-radius: 7px; margin-right:0.5em;" (click)="drawerOpen = !drawerOpen" aria-label="Open menu">
    &#9776;
  </button>
  <span style="font-weight:600; font-size: 1.25rem; margin-right: 2rem;">TicketFlow</span>
  <a routerLink="/tickets" routerLinkActive="active"
      style="color:#fff;text-decoration:none;padding:0.6em 1.2em; font-size:1.08em;border-radius:5px;font-weight:500; margin-right:8px;"
      >Tickets</a>
  <a routerLink="/admin" routerLinkActive="active"
      style="color:#fff;text-decoration:none;padding:0.6em 1.2em; font-size:1.08em;border-radius:5px;font-weight:500; background:var(--accent)"
      >Admin</a>
  <span style="flex:1 1 auto;"></span>
</nav>

<!-- Side Drawer (admin actions/links) -->
<div
  class="sidebar-drawer shadow"
  [ngStyle]="{ 
    width: drawerOpen ? 'var(--drawer-width)' : '0',
    minWidth: drawerOpen ? 'var(--drawer-width)' : '0'
  }"
  [class.active]="drawerOpen"
  style="
    position: fixed;
    top: var(--navbar-height);
    left: 0; bottom: 0;
    z-index: 1120;
    background: var(--drawer-bg);
    overflow-y: auto;
    box-shadow: var(--drawer-shadow);
    transition: width 0.18s, min-width 0.18s, left 0.28s;
    max-width: 92vw;
    height: calc(100% - var(--navbar-height));
    border-right: 1px solid #e4e9f2;
  "
>
  <div style="padding: 2em 1.3em 1em 1.45em; color: var(--primary); font-size: 1.28em; font-weight: 600;">
    Admin
    <button class="btn" style="background: var(--accent); color: #fff; padding: 0.1em 0.7em 0.1em 0.7em; border-radius:10px;font-weight:500; float:right;" (click)="drawerOpen=false">x</button>
  </div>
  <hr style="margin: 0.3em 0;">
  <nav style="display: flex; flex-direction: column; gap:0.7em; padding: 0 1em;">
    <a routerLink="/admin" routerLinkActive="active" style="font-weight:500; color:var(--primary); text-decoration: none; padding:0.4em 0.8em;border-radius:5px;">Dashboard</a>
    <a routerLink="/tickets" routerLinkActive="active" style="font-weight:500; color:var(--primary); text-decoration: none; padding:0.4em 0.8em;border-radius:5px;">View Tickets</a>
    <!-- More admin links/actions can be added here -->
  </nav>
</div>
<!-- Mobile backdrop for side drawer -->
<div class="overlay-backdrop" [class.active]="drawerOpen" (click)="drawerOpen=false"></div>

<!-- Main Layout Content Area -->
<div
  class="main-layout"
  style="
    display: flex;
    flex-direction: row;
    min-height: 100vh;
    background: var(--surface);
    margin: 0;
    margin-top: var(--navbar-height);
    transition: margin-left 0.18s;
  "
  [ngStyle]="{
    'margin-left': (drawerOpen ? 'var(--drawer-width)' : '0')
  }"
>
  <div style="flex:1 1 auto; display: flex; flex-direction:column; min-width:0; width:100%;">
    <div style="padding: 2.2vw 1vw 2vw 1vw;max-width:1024px;min-width:0;width:100%;margin:0 auto;box-sizing:border-box;">
      <router-outlet></router-outlet>
    </div>
  </div>
</div>
